<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Resume textos y detecta su tono con IA que corre en tu navegador." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%237c3aed'/><text x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>IA</text></svg>" />
    <title>Resumidor IA</title>
    <script type="module" crossorigin src="./assets/index-GljlCBxE.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BjA7MRaV.css">
  </head>
  <body>
    <main>
      <h1>Resumidor IA</h1>
      <p class="sub">Resume un texto y detecta su tono con modelos que corren en tu navegador. El texto no sale de tu dispositivo.</p>
      <form id="formulario">
        <label for="texto">Texto (español, inglés y otros idiomas)</label>
        <textarea id="texto" placeholder="Pegá una nota, un artículo o un mail largo…"></textarea>
        <div class="controles">
          <label>Oraciones del resumen
            <select id="cantidad"><option>2</option><option selected>3</option><option>5</option></select>
          </label>
          <button type="submit" id="analizar">Resumir</button>
          <button type="button" id="ejemplo">Probar con un ejemplo</button>
        </div>
        <p id="estado" role="status"></p>
      </form>
      <section id="resultado" hidden>
        <h2>Resumen</h2>
        <ol id="resumen"></ol>
        <p>Tono: <strong id="sentimiento"></strong></p>
        <p id="metricas"></p>
      </section>
      <footer>Modelos: paraphrase-multilingual-MiniLM-L12-v2 y bert-base-multilingual-uncased-sentiment, vía Transformers.js. <a href="https://github.com/nbbz95/resumidor-ia">Código</a>.</footer>
    </main>
  </body>
</html>
